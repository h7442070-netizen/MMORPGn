<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>みんなでアクションMMO</title>
<style>
  :root { --bg:#14202b; --panel:rgba(10,18,26,.82); --text:#eef3f7; --accent:#ffb347; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:10; padding:16px; }
  #login .box { width:100%; max-width:340px; display:grid; gap:14px; }
  #login h1 { margin:0; font-size:26px; }
  input[type=text] { width:100%; padding:12px; font-size:16px; border-radius:8px; border:2px solid #34495c; background:#0d1620; color:var(--text); }
  input[type=text]:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { padding:12px; font-size:16px; border:0; border-radius:8px; background:var(--accent); color:#1b1204; font-weight:700; }
  .colors { display:flex; gap:10px; }
  .colors label { flex:1; }
  .colors input { display:none; }
  .colors span { display:block; height:40px; border-radius:8px; border:3px solid transparent; }
  .colors input:checked + span { border-color:#fff; }
  #chat { position:fixed; left:8px; top:calc(8px + env(safe-area-inset-top,0px)); width:min(320px, 70vw); z-index:5; }
  #log { max-height:30vh; overflow-y:auto; background:var(--panel); border-radius:8px; padding:6px 8px; font-size:13px; line-height:1.5; }
  #log div { word-break:break-all; }
  #log .sys { color:#9fb3c4; }
  #log b { color:var(--accent); font-weight:700; }
  #chatForm { display:flex; gap:6px; margin-top:6px; }
  #chatForm input { flex:1; padding:8px; font-size:14px; }
  #chatForm button { padding:8px 12px; font-size:14px; }
  #stick { position:fixed; left:calc(24px + env(safe-area-inset-left,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3); display:none; }
  #knob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.7); }
  @media (pointer:coarse) { #stick { display:block; } }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>みんなでアクションMMO</h1>
    <input id="nameIn" type="text" maxlength="12" placeholder="キャラの名前" aria-label="キャラの名前">
    <div class="colors" role="radiogroup" aria-label="キャラの色">
      <label><input type="radio" name="c" value="#4aa3ff" checked><span style="background:#4aa3ff"></span></label>
      <label><input type="radio" name="c" value="#ff6b6b"><span style="background:#ff6b6b"></span></label>
      <label><input type="radio" name="c" value="#5fd068"><span style="background:#5fd068"></span></label>
      <label><input type="radio" name="c" value="#c78bff"><span style="background:#c78bff"></span></label>
    </div>
    <button id="go">はじめる</button>
  </div>
</div>

<canvas id="cv"></canvas>
<div id="chat" hidden>
  <div id="log"></div>
  <form id="chatForm">
    <input id="chatIn" type="text" maxlength="100" placeholder="メッセージ" aria-label="メッセージ" autocomplete="off">
    <button>送信</button>
  </form>
</div>
<div id="stick"><div id="knob"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let socket, me = null, world = { W:1600, H:1200 }, players = [];
const bubbles = {};
const smooth = {};

function resize() {
  const r = devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', resize); resize();

document.getElementById('go').onclick = () => {
  const name = document.getElementById('nameIn').value.trim();
  if (!name) { document.getElementById('nameIn').focus(); return; }
  const color = document.querySelector('input[name=c]:checked').value;
  socket = io();
  socket.on('init', d => { me = d.id; world = d; });
  socket.on('state', s => { players = s; });
  socket.on('chat', m => {
    addLog(m.name, m.text);
    bubbles[m.id] = { text: m.text, until: Date.now() + 4000 };
  });
  socket.on('system', t => addLog(null, t));
  socket.emit('join', { name, color });
  document.getElementById('login').style.display = 'none';
  document.getElementById('chat').hidden = false;
  requestAnimationFrame(loop);
};

function addLog(name, text) {
  const log = document.getElementById('log');
  const row = document.createElement('div');
  if (name) { const b = document.createElement('b'); b.textContent = name + ': '; row.append(b, text); }
  else { row.className = 'sys'; row.textContent = text; }
  log.appendChild(row);
  while (log.children.length > 50) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('chatForm').onsubmit = e => {
  e.preventDefault();
  const i = document.getElementById('chatIn');
  if (i.value.trim()) socket.emit('chat', i.value);
  i.value = '';
};

const keys = {}; let stickV = { x:0, y:0 }, last = '';
addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
function moveStick(t) {
  const r = stick.getBoundingClientRect();
  let x = (t.clientX - (r.left + r.width/2)) / 50, y = (t.clientY - (r.top + r.height/2)) / 50;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  stickV = { x, y };
  knob.style.left = (40 + x*40) + 'px'; knob.style.top = (40 + y*40) + 'px';
}
stick.addEventListener('touchstart', e => { e.preventDefault(); moveStick(e.touches[0]); }, { passive:false });
stick.addEventListener('touchmove', e => { e.preventDefault(); moveStick(e.touches[0]); }, { passive:false });
const endStick = () => { stickV = { x:0, y:0 }; knob.style.left = '40px'; knob.style.top = '40px'; };
stick.addEventListener('touchend', endStick); stick.addEventListener('touchcancel', endStick);

function sendInput() {
  let dx = stickV.x, dy = stickV.y;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  const k = dx.toFixed(2) + ',' + dy.toFixed(2);
  if (k !== last) { last = k; socket.emit('input', { dx, dy }); }
}

function loop() {
  sendInput();
  const vw = innerWidth, vh = innerHeight;
  for (const p of players) {
    const s = smooth[p.id] || (smooth[p.id] = { x:p.x, y:p.y });
    s.x += (p.x - s.x) * 0.3; s.y += (p.y - s.y) * 0.3;
  }
  const mine = smooth[me] || { x:world.W/2, y:world.H/2 };
  const cx = Math.max(0, Math.min(world.W - vw, mine.x - vw/2));
  const cy = Math.max(0, Math.min(world.H - vh, mine.y - vh/2));
  ctx.fillStyle = '#1d3a2b'; ctx.fillRect(0, 0, vw, vh);
  ctx.save(); ctx.translate(-cx, -cy);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for (let x = 0; x <= world.W; x += 80) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,world.H); ctx.stroke(); }
  for (let y = 0; y <= world.H; y += 80) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(world.W,y); ctx.stroke(); }
  ctx.strokeStyle = '#e8d9a8'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, world.W, world.H);
  ctx.textAlign = 'center';
  for (const p of players) {
    const s = smooth[p.id];
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(s.x, s.y+14, 16, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, 7); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = p.id === me ? '#fff' : 'rgba(0,0,0,.5)'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '13px sans-serif'; ctx.fillText(p.name, s.x, s.y - 26);
    const b = bubbles[p.id];
    if (b && b.until > Date.now()) {
      ctx.font = '13px sans-serif';
      const w = ctx.measureText(b.text).width + 16;
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(s.x - w/2, s.y - 62, w, 22);
      ctx.fillStyle = '#111'; ctx.fillText(b.text, s.x, s.y - 46);
    }
  }
  ctx.restore();
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
