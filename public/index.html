<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>みんなでアクションMMO</title>
<style>
  :root { --bg:#14202b; --panel:rgba(10,18,26,.88); --text:#eef3f7; --accent:#ffb347; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:"Hiragino Sans","Noto Sans JP",sans-serif; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:10; padding:16px; overflow-y:auto; }
  #login .box { width:100%; max-width:340px; display:grid; gap:12px; }
  #login h1 { margin:0; font-size:24px; }
  label.f { display:grid; gap:4px; font-size:13px; color:#9fb3c4; }
  input[type=text], select { width:100%; padding:12px; font-size:16px; border-radius:8px; border:2px solid #34495c; background:#0d1620; color:var(--text); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button { padding:12px; font-size:16px; border:0; border-radius:8px; background:var(--accent); color:#1b1204; font-weight:700; }
  button:disabled { opacity:.35; }
  button.sub { background:#34495c; color:var(--text); }
  .colors { display:flex; gap:10px; }
  .colors label { flex:1; }
  .colors input { display:none; }
  .colors span { display:block; height:36px; border-radius:8px; border:3px solid transparent; }
  .colors input:checked + span { border-color:#fff; }
  #chat { position:fixed; left:8px; top:calc(8px + env(safe-area-inset-top,0px)); width:min(300px, 60vw); z-index:5; }
  #log { max-height:26vh; overflow-y:auto; background:var(--panel); border-radius:8px; padding:6px 8px; font-size:13px; line-height:1.5; }
  #log div { word-break:break-all; }
  #log .sys { color:#9fb3c4; }
  #log b { color:var(--accent); }
  #chatForm { display:flex; gap:6px; margin-top:6px; }
  #chatForm input { flex:1; padding:8px; font-size:14px; }
  #chatForm button { padding:8px 12px; font-size:14px; }
  #hud { position:fixed; right:8px; top:calc(8px + env(safe-area-inset-top,0px)); z-index:5; background:var(--panel); border-radius:8px; padding:8px 10px; font-size:13px; line-height:1.6; min-width:140px; }
  #bar { height:6px; background:#34495c; border-radius:3px; margin-top:4px; }
  #bar i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  #stick { position:fixed; left:calc(24px + env(safe-area-inset-left,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3); display:none; }
  #knob { position:absolute; left:40px; top:40px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.7); }
  @media (pointer:coarse) { #stick { display:block; } }
  #btns { position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:5; display:grid; gap:10px; justify-items:end; }
  #atkBtn { width:84px; height:84px; border-radius:50%; font-size:18px; }
  #menuBtn, #autoBtn, #shopBtn, #buildBtn { padding:10px 16px; background:#34495c; color:var(--text); }
  #autoBtn.on, #buildBtn.on { background:var(--accent); color:#1b1204; }
  #acts { position:fixed; right:calc(112px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:5; display:flex; flex-wrap:wrap; gap:8px; max-width:190px; justify-content:flex-end; }
  #acts button { padding:10px 12px; font-size:13px; background:#4a1f2b; color:#fff; border:2px solid #fff; }
  #acts button[hidden] { display:none; }
  #menu, #shop { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:8; display:flex; align-items:center; justify-content:center; padding:16px; }
  #menu[hidden], #shop[hidden] { display:none; }
  #menu .card, #shop .card { background:#16232f; border-radius:12px; padding:16px; width:100%; max-width:380px; max-height:90vh; overflow-y:auto; display:grid; gap:12px; }
  #menu h2, #shop h2 { margin:0; font-size:18px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .row.locked { opacity:.55; }
  .row.child { margin-left:18px; border-left:3px solid #34495c; padding-left:10px; }
  .row small { color:#9fb3c4; display:block; }
  .row button { padding:8px 14px; font-size:15px; }
</style>
</head>
<body>
<div id="login">
  <div class="box">
    <h1>みんなでアクションMMO</h1>
    <button id="cont" hidden></button>
    <label class="f">名前<input id="nameIn" type="text" maxlength="12" placeholder="キャラの名前"></label>
    <label class="f">種族
      <select id="raceIn"><optgroup label="ひと"><option>人間</option><option>エルフ</option><option>ドワーフ</option><option>獣人</option></optgroup><optgroup label="魔物(まれにキマイラになる)"><option>スライム</option><option>ゴブリン</option><option>ドラゴン</option></optgroup></select>
    </label>
    <label class="f">職業
      <select id="jobIn"><option>盗賊</option><option>戦士</option><option>魔法使い</option></select>
    </label>
    <div class="colors" role="radiogroup" aria-label="キャラの色">
      <label><input type="radio" name="c" value="#4aa3ff" checked><span style="background:#4aa3ff"></span></label>
      <label><input type="radio" name="c" value="#ff6b6b"><span style="background:#ff6b6b"></span></label>
      <label><input type="radio" name="c" value="#5fd068"><span style="background:#5fd068"></span></label>
      <label><input type="radio" name="c" value="#c78bff"><span style="background:#c78bff"></span></label>
    </div>
    <button id="go">はじめから</button>
    <div id="warn" hidden style="font-size:12px;color:#9fb3c4">「はじめから」を押すと、いまのセーブは消えます。</div>
  </div>
</div>

<canvas id="cv"></canvas>
<div id="chat" hidden>
  <div id="log"></div>
  <form id="chatForm">
    <input id="chatIn" type="text" maxlength="100" placeholder="メッセージ" autocomplete="off">
    <button>送信</button>
  </form>
</div>
<div id="hud" hidden></div>
<div id="stick"><div id="knob"></div></div>
<div id="acts"></div>
<div id="btns" hidden>
  <button id="menuBtn">メニュー</button>
  <button id="shopBtn">ショップ</button>
  <button id="buildBtn">ブロック: OFF</button>
  <button id="autoBtn">オート: OFF</button>
  <button id="atkBtn">攻撃</button>
</div>
<div id="menu" hidden><div class="card" id="menuCard"></div></div>
<div id="shop" hidden><div class="card" id="shopCard"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let socket, me = null, world = { W:1600, H:1200, EVO_LV:[0,5,10], chains:{}, skills:{} };
let players = [], monsters = [];
const bubbles = {}, smooth = {}, swing = {}, mflash = {}, cdUntil = {};
let blocks = [], camX = 0, camY = 0, buildMode = 0;
let menuKey = '';
const SAVE_KEY = 'mmoSave1';

function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function writeSave(d) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) {} }

const saved = loadSave();
if (saved && saved.name) {
  $('cont').hidden = false; $('warn').hidden = false;
  $('cont').textContent = 'つづきから: ' + saved.name + ' Lv' + saved.lv;
  $('cont').onclick = () => start({ save: saved });
}

function resize() {
  const r = devicePixelRatio || 1;
  cv.width = innerWidth * r; cv.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener('resize', resize); resize();

$('go').onclick = () => {
  const name = $('nameIn').value.trim();
  if (!name) { $('nameIn').focus(); return; }
  start({ name, color: document.querySelector('input[name=c]:checked').value, race: $('raceIn').value, job: $('jobIn').value });
};

function start(join) {
  socket = io();
  socket.on('init', d => { me = d.id; world = d; });
  socket.on('save', s => { writeSave(s); myData = s; if (!$('shop').hidden && shopTab !== 'craft') renderShop(); });
  socket.on('wart', a => { arts[a.id] = makeArt(a.pix); });
  socket.on('state', s => { players = s.players; monsters = s.monsters; updateUI(); });
  socket.on('chat', m => { addLog(m.name, m.text); bubbles[m.id] = { text:m.text, until:Date.now()+4000 }; });
  socket.on('system', t => addLog(null, t));
  socket.on('matk', a => { mflash[a.id] = Date.now() + 200; });
  socket.on('cast', a => {
    swing[a.id] = { until: Date.now() + 350, r: a.r, c: a.c };
    if (a.id === me && world.ACT && world.ACT[a.key]) cdUntil[a.key] = Date.now() + world.ACT[a.key].cd;
  });
  socket.on('blocks', b => { blocks = b; });
  socket.on('sys1', t => addLog(null, t));
  socket.on('atk', a => { swing[a.id] = { until: Date.now() + 150, r: a.r }; });
  socket.emit('join', join);
  $('login').style.display = 'none';
  $('chat').hidden = false; $('hud').hidden = false; $('btns').hidden = false;
  requestAnimationFrame(loop);
}

function addLog(name, text) {
  const row = document.createElement('div');
  if (name) { const b = document.createElement('b'); b.textContent = name + ': '; row.append(b, text); }
  else { row.className = 'sys'; row.textContent = text; }
  $('log').appendChild(row);
  while ($('log').children.length > 50) $('log').removeChild($('log').firstChild);
  $('log').scrollTop = $('log').scrollHeight;
}
$('chatForm').onsubmit = e => {
  e.preventDefault();
  if ($('chatIn').value.trim()) socket.emit('chat', $('chatIn').value);
  $('chatIn').value = '';
};

const jobName = p => (world.chains[p.job] || [p.job])[p.stage];
const mine = () => players.find(p => p.id === me);
const mKey = p => [p.lv, p.sp, p.stage, JSON.stringify(p.sk)].join();

function updateUI() {
  const p = mine(); if (!p) return;
  $('hud').innerHTML = '';
  const t = document.createElement('div');
  t.textContent = p.name + ' / ' + p.race + ' ' + jobName(p) + ' Lv' + p.lv;
  const g = document.createElement('div');
  g.textContent = 'HP ' + p.hp + '/' + p.mhp + ' / ゴールド ' + p.gold + ' / SP ' + p.sp;
  const bar = document.createElement('div'); bar.id = 'bar';
  const i = document.createElement('i'); i.style.width = Math.min(100, p.exp / (p.lv * 30) * 100) + '%';
  bar.appendChild(i);
  $('hud').append(t, g, bar);
  updateActs(p);
  if (!$('menu').hidden && mKey(p) !== menuKey) renderMenu();
}

function renderMenu() {
  const p = mine(); if (!p) return;
  menuKey = mKey(p);
  const c = $('menuCard'); c.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = p.race + ' ' + jobName(p) + ' Lv' + p.lv; c.appendChild(h);
  const sp = document.createElement('div'); sp.textContent = '使えるSP: ' + p.sp + '(レベルが上がると1もらえる)'; c.appendChild(sp);
  const S = world.skills;
  for (const k in S) {
    const d = S[k];
    if (d.jobs && !d.jobs.includes(p.job)) continue;
    if (d.races && !d.races.includes(p.race)) continue;
    const need = Object.keys(d.req);
    const ok = need.every(r => p.sk[r] >= d.req[r]);
    const r = document.createElement('div');
    r.className = 'row' + (need.length ? ' child' : '') + (ok ? '' : ' locked');
    const l = document.createElement('div'); l.textContent = d.name + ' Lv' + p.sk[k];
    const s = document.createElement('small');
    s.textContent = ok ? d.desc : '解放: ' + need.map(x => S[x].name + d.req[x]).join('、') + ' が必要';
    l.appendChild(s);
    const b = document.createElement('button'); b.textContent = '+';
    b.disabled = !ok || p.sp < 1;
    b.onclick = () => socket.emit('skill', k);
    r.append(l, b); c.appendChild(r);
  }
  const chain = world.chains[p.job] || [];
  const r = document.createElement('div'); r.className = 'row';
  const l = document.createElement('div');
  if (p.stage >= 2) l.textContent = '最終形態です';
  else { l.textContent = '進化: ' + chain[p.stage + 1]; const s = document.createElement('small'); s.textContent = 'Lv' + world.EVO_LV[p.stage + 1] + ' で進化できる'; l.appendChild(s); }
  const b = document.createElement('button'); b.textContent = '進化';
  b.disabled = p.stage >= 2 || p.lv < world.EVO_LV[p.stage + 1];
  b.onclick = () => socket.emit('evolve');
  r.append(l, b); c.appendChild(r);
  const x = document.createElement('button'); x.textContent = '閉じる';
  x.onclick = () => { $('menu').hidden = true; };
  c.appendChild(x);
}
// ---- ショップ・武器・お絵かき ----
let myData = null, shopTab = 'shop', ed = new Array(256).fill(0), col = 1;
const arts = {};
const PAL = ['', '#111111', '#ffffff', '#9aa0a6', '#8b5a2b', '#d2a679', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#ff80ab', '#00bcd4', '#5d4037', '#ffd700'];
const el = (t, x) => { const e = document.createElement(t); if (x != null) e.textContent = x; return e; };

function makeArt(pix) {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  for (let i = 0; i < 256; i++) {
    const v = parseInt(pix[i], 16); if (!v) continue;
    g.fillStyle = PAL[v]; g.fillRect(i % 16, Math.floor(i / 16), 1, 1);
  }
  return c;
}
function drawEd(c) {
  const g = c.getContext('2d');
  g.fillStyle = '#e9eef2'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i++) {
    const x = (i % 16) * 16, y = Math.floor(i / 16) * 16;
    if (ed[i]) { g.fillStyle = PAL[ed[i]]; g.fillRect(x, y, 16, 16); }
    g.strokeStyle = 'rgba(0,0,0,.12)'; g.strokeRect(x + .5, y + .5, 15, 15);
  }
}
function renderShop() {
  const d = myData; if (!d) return;
  const c = $('shopCard'); c.innerHTML = '';
  c.appendChild(el('h2', 'ショップ'));
  c.appendChild(el('div', 'ゴールド: ' + d.gold + ' / もっている武器: ' + d.weapons.length + '/20'));
  const tabs = el('div'); tabs.style.cssText = 'display:flex;gap:6px';
  [['shop', 'ぶきや'], ['inv', 'もちもの'], ['craft', 'じさく']].forEach(([k, n]) => {
    const b = el('button', n); b.style.cssText = 'flex:1;padding:8px;font-size:14px';
    if (shopTab !== k) b.className = 'sub';
    b.onclick = () => { shopTab = k; renderShop(); };
    tabs.appendChild(b);
  });
  c.appendChild(tabs);
  const has = id => d.weapons.some(w => w.id === id);
  if (shopTab === 'shop') {
    for (const w of world.SHOP || []) {
      const r = el('div'); r.className = 'row';
      const l = el('div', w.name); l.appendChild(el('small', '攻撃力 +' + w.atk));
      const b = el('button', has(w.id) ? 'もっている' : w.price + 'G で買う');
      b.disabled = has(w.id) || d.gold < w.price || d.weapons.length >= 20;
      b.onclick = () => socket.emit('buy', w.id);
      r.append(l, b); c.appendChild(r);
    }
  } else if (shopTab === 'inv') {
    const r0 = el('div'); r0.className = 'row';
    const b0 = el('button', d.eq ? 'はずす' : 'そうびなし'); b0.disabled = !d.eq;
    b0.onclick = () => socket.emit('equip', null);
    r0.append(el('div', '素手'), b0); c.appendChild(r0);
    for (const w of d.weapons) {
      const r = el('div'); r.className = 'row';
      const l = el('div', w.name); l.appendChild(el('small', '攻撃力 +' + w.atk));
      if (w.pix) { const a = makeArt(w.pix); a.style.cssText = 'width:32px;image-rendering:pixelated;display:block;margin-bottom:4px'; l.prepend(a); }
      const b = el('button', d.eq === w.id ? 'そうびちゅう' : 'そうびする'); b.disabled = d.eq === w.id;
      b.onclick = () => socket.emit('equip', w.id);
      r.append(l, b); c.appendChild(r);
    }
  } else {
    c.appendChild(el('div', '16×16のドットで、自分の武器を描けます。'));
    const cv2 = document.createElement('canvas'); cv2.width = cv2.height = 256;
    cv2.style.cssText = 'width:100%;max-width:256px;touch-action:none;border-radius:6px;justify-self:center';
    drawEd(cv2);
    let down = false;
    const paint = e => {
      const r = cv2.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / r.width * 16), y = Math.floor((e.clientY - r.top) / r.height * 16);
      if (x < 0 || y < 0 || x > 15 || y > 15) return;
      ed[y * 16 + x] = col; drawEd(cv2);
    };
    cv2.onpointerdown = e => { down = true; cv2.setPointerCapture(e.pointerId); paint(e); };
    cv2.onpointermove = e => { if (down) paint(e); };
    cv2.onpointerup = () => { down = false; };
    c.appendChild(cv2);
    const pal = el('div'); pal.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;justify-content:center';
    for (let i = 0; i < 16; i++) {
      const b = el('button', i ? '' : '消す'); b.style.cssText = 'width:34px;height:34px;padding:0;font-size:11px;border:3px solid ' + (col === i ? '#fff' : 'transparent') + ';background:' + (PAL[i] || '#34495c') + ';color:#fff';
      b.onclick = () => { col = i; [...pal.children].forEach((x, j) => { x.style.borderColor = j === i ? '#fff' : 'transparent'; }); };
      pal.appendChild(b);
    }
    c.appendChild(pal);
    const clr = el('button', '全部消す'); clr.className = 'sub';
    clr.onclick = () => { ed.fill(0); drawEd(cv2); };
    c.appendChild(clr);
    const nm = el('input'); nm.type = 'text'; nm.maxLength = 10; nm.placeholder = '武器の名前';
    c.appendChild(nm);
    const sel = el('select');
    (world.TIERS || []).forEach((t, i) => { const o = el('option', t.price + 'G(攻撃力 +' + t.atk + ')'); o.value = i; sel.appendChild(o); });
    c.appendChild(sel);
    const mk = el('button', 'つくる');
    mk.onclick = () => {
      const t = world.TIERS[sel.value];
      if (ed.every(v => !v)) { alert('先に絵を描いてください'); return; }
      if (d.gold < t.price) { alert('ゴールドが足りません'); return; }
      if (d.weapons.length >= 20) { alert('武器がいっぱいです'); return; }
      socket.emit('craft', { name: nm.value, tier: Number(sel.value), pix: ed.map(v => v.toString(16)).join('') });
      shopTab = 'inv'; setTimeout(renderShop, 300);
    };
    c.appendChild(mk);
  }
  const x = el('button', '閉じる'); x.onclick = () => { $('shop').hidden = true; };
  c.appendChild(x);
}
$('shopBtn').onclick = () => { $('shop').hidden = false; renderShop(); };

const actBtns = {};
function updateActs(p) {
  const now = Date.now(), A = world.ACT || {};
  for (const k in A) {
    const lv = p.sk[k] || 0;
    let b = actBtns[k];
    if (!lv) { if (b) b.hidden = true; continue; }
    if (!b) {
      b = actBtns[k] = el('button'); b.style.borderColor = A[k].c;
      b.onpointerdown = e => { e.preventDefault(); socket.emit('cast', k); };
      $('acts').appendChild(b);
    }
    b.hidden = false;
    const left = Math.ceil(((cdUntil[k] || 0) - now) / 1000);
    b.textContent = A[k].name + (left > 0 ? ' ' + left : '');
    b.style.opacity = left > 0 ? 0.45 : 1;
  }
}
$('menuBtn').onclick = () => { $('menu').hidden = false; renderMenu(); };
$('atkBtn').addEventListener('touchstart', e => { e.preventDefault(); socket.emit('attack'); }, { passive:false });
$('atkBtn').onclick = () => socket.emit('attack');

const keys = {}; let stickV = { x:0, y:0 }, lastIn = '';
addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') socket.emit('attack');
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const stick = $('stick'), knob = $('knob');
function moveStick(t) {
  const r = stick.getBoundingClientRect();
  let x = (t.clientX - (r.left + r.width/2)) / 50, y = (t.clientY - (r.top + r.height/2)) / 50;
  const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
  stickV = { x, y }; knob.style.left = (40 + x*40) + 'px'; knob.style.top = (40 + y*40) + 'px';
}
stick.addEventListener('touchstart', e => { e.preventDefault(); moveStick(e.touches[0]); }, { passive:false });
stick.addEventListener('touchmove', e => { e.preventDefault(); moveStick(e.touches[0]); }, { passive:false });
const endStick = () => { stickV = { x:0, y:0 }; knob.style.left = '40px'; knob.style.top = '40px'; };
stick.addEventListener('touchend', endStick); stick.addEventListener('touchcancel', endStick);

let auto = false, lastAtk = 0, wake = null;
async function setWake(on) {
  try {
    if (on && navigator.wakeLock) wake = await navigator.wakeLock.request('screen');
    else if (wake) { await wake.release(); wake = null; }
  } catch (e) {}
}
function setAuto(on) {
  auto = on;
  $('autoBtn').textContent = 'オート: ' + (on ? 'ON' : 'OFF');
  $('autoBtn').classList.toggle('on', on);
  setWake(on);
}
const BM = ['OFF', 'おく(10G)', 'こわす'];
$('buildBtn').onclick = () => {
  buildMode = (buildMode + 1) % 3;
  $('buildBtn').textContent = 'ブロック: ' + BM[buildMode];
  $('buildBtn').classList.toggle('on', buildMode > 0);
};
cv.addEventListener('pointerdown', e => {
  if (!buildMode || !socket) return;
  const CS = world.CELL || 40;
  const gx = Math.floor((e.clientX + camX) / CS), gy = Math.floor((e.clientY + camY) / CS);
  socket.emit(buildMode === 1 ? 'build' : 'unbuild', { gx, gy });
});
$('autoBtn').onclick = () => setAuto(!auto);
addEventListener('visibilitychange', () => { if (auto && document.visibilityState === 'visible') setWake(true); });

function sendInput() {
  let dx = stickV.x, dy = stickV.y;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (auto) {
    if (Math.hypot(dx, dy) > 0.2) setAuto(false);
    else {
      const p = mine(); let best = null, bd = 1e9;
      if (p) for (const m of monsters) {
        if (m.hp <= 0) continue;
        const d = Math.hypot(m.x - p.x, m.y - p.y);
        if (d < bd) { bd = d; best = m; }
      }
      if (best && bd > 45) { dx = (best.x - p.x) / bd; dy = (best.y - p.y) / bd; }
      if (best && bd < 70 && Date.now() - lastAtk > 420) { lastAtk = Date.now(); socket.emit('attack'); }
    }
  }
  const k = dx.toFixed(2) + ',' + dy.toFixed(2);
  if (k !== lastIn) { lastIn = k; socket.emit('input', { dx, dy }); }
}

function loop() {
  sendInput();
  const vw = innerWidth, vh = innerHeight, now = Date.now();
  for (const p of players) {
    const s = smooth[p.id] || (smooth[p.id] = { x:p.x, y:p.y });
    s.x += (p.x - s.x) * 0.3; s.y += (p.y - s.y) * 0.3;
  }
  const m0 = smooth[me] || { x:world.W/2, y:world.H/2 };
  const cx = Math.max(0, Math.min(world.W - vw, m0.x - vw/2));
  const cy = Math.max(0, Math.min(world.H - vh, m0.y - vh/2));
  camX = cx; camY = cy;
  ctx.fillStyle = '#1d3a2b'; ctx.fillRect(0, 0, vw, vh);
  ctx.save(); ctx.translate(-cx, -cy);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
  for (let x = 0; x <= world.W; x += 80) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,world.H); ctx.stroke(); }
  for (let y = 0; y <= world.H; y += 80) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(world.W,y); ctx.stroke(); }
  ctx.strokeStyle = '#e8d9a8'; ctx.lineWidth = 4; ctx.strokeRect(0, 0, world.W, world.H);
  const myUid = myData && myData.uid, CS = world.CELL || 40;
  for (const b of blocks) {
    ctx.fillStyle = b.o === myUid ? '#a1887f' : '#8d6e63'; ctx.fillRect(b.gx * CS, b.gy * CS, CS, CS);
    ctx.strokeStyle = '#4e342e'; ctx.lineWidth = 2; ctx.strokeRect(b.gx * CS + 1, b.gy * CS + 1, CS - 2, CS - 2);
  }
  ctx.textAlign = 'center';
  ctx.strokeStyle = 'rgba(120,200,255,.5)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.arc(world.W / 2, world.H / 2, world.SAFE || 150, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(120,200,255,.6)'; ctx.font = '13px sans-serif'; ctx.fillText('安全地帯(ここではたたかえない)', world.W / 2, world.H / 2 + 4);
  const MC = { slime: ['#7ad67a', 18, 14], goblin: ['#c9a227', 16, 16], wolf: ['#9aa0a6', 22, 12] };
  const MN = { slime: 'スライム', goblin: 'ゴブリン', wolf: 'オオカミ' };
  for (const m of monsters) {
    if (m.hp <= 0) continue;
    const mc = MC[m.type] || MC.slime;
    ctx.fillStyle = mc[0]; ctx.beginPath(); ctx.ellipse(m.x, m.y, mc[1], mc[2], 0, 0, 7); ctx.fill();
    if (mflash[m.id] > now) { ctx.strokeStyle = '#f33'; ctx.lineWidth = 4; ctx.stroke(); }
    ctx.fillStyle = '#143'; ctx.fillRect(m.x-7, m.y-4, 3, 3); ctx.fillRect(m.x+4, m.y-4, 3, 3);
    ctx.fillStyle = '#400'; ctx.fillRect(m.x-18, m.y-28, 36, 4);
    ctx.fillStyle = '#e44'; ctx.fillRect(m.x-18, m.y-28, 36 * m.hp / m.max, 4);
    ctx.fillStyle = '#fff'; ctx.font = '11px sans-serif'; ctx.fillText(MN[m.type] || '', m.x, m.y - 32);
  }
  for (const p of players) {
    const s = smooth[p.id], sw = swing[p.id];
    ctx.globalAlpha = p.dead ? 0.35 : 1;
    if (sw && sw.until > now) { ctx.strokeStyle = sw.c || 'rgba(255,255,255,.8)'; ctx.lineWidth = sw.c ? 6 : 3; ctx.beginPath(); ctx.arc(s.x, s.y, sw.r || 80, 0, 7); ctx.stroke(); }
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(s.x, s.y+14, 16, 6, 0, 0, 7); ctx.fill();
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(s.x, s.y, 16, 0, 7); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = p.id === me ? '#fff' : 'rgba(0,0,0,.5)'; ctx.stroke();
    if (p.wid) {
      const a = arts[p.wid];
      if (a) { ctx.imageSmoothingEnabled = false; ctx.drawImage(a, s.x + 8, s.y - 24, 32, 32); }
      else if (!String(p.wid).startsWith('c')) { ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(s.x + 12, s.y + 8); ctx.lineTo(s.x + 34, s.y - 16); ctx.stroke(); }
    }
    ctx.fillStyle = '#400'; ctx.fillRect(s.x - 18, s.y + 22, 36, 4);
    ctx.fillStyle = '#4c4'; ctx.fillRect(s.x - 18, s.y + 22, 36 * Math.max(0, p.hp) / p.mhp, 4);
    ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif';
    ctx.fillText(p.name + ' Lv' + p.lv, s.x, s.y - 36);
    ctx.fillStyle = '#ffd98a'; ctx.fillText(p.race + ' ' + jobName(p), s.x, s.y - 24);
    const b = bubbles[p.id];
    if (b && b.until > now) {
      ctx.font = '13px sans-serif';
      const w = ctx.measureText(b.text).width + 16;
      ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.fillRect(s.x - w/2, s.y - 70, w, 22);
      ctx.fillStyle = '#111'; ctx.fillText(b.text, s.x, s.y - 54);
    }
  }
  ctx.restore();
  const mp = mine();
  if (mp && mp.dead) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, vw, vh);
    ctx.fillStyle = '#fff'; ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('やられた…まもなく復活', vw / 2, vh / 2);
  }
  requestAnimationFrame(loop);
}
</script>
